<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="一隻黃金鵜鶘騎著單車，走遍小島、操場、夜市、圓環、銀閣寺、月球、極地、雨林、雲海和凱旋門。">
<style>*{box-sizing:border-box}</style>
</head>
<body>
<title>鵜鶘騎單車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
  :root {
    --sky: #86B9D2;
    --ink: #F6F3EA;
    --ink-soft: rgba(246, 243, 234, .72);
    --panel: rgba(22, 44, 58, .62);
    --line: rgba(246, 243, 234, .22);
    --beak: #F0B24A;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--sky);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .card {
    position: fixed;
    left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: min(340px, calc(100% - 32px));
    padding: 14px 16px 12px;
    background: var(--panel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: grid; gap: 10px;
  }
  .card h1 {
    margin: 0; font-size: 22px; line-height: 1.15; font-weight: 700;
    font-family: "Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
    text-wrap: balance;
  }
  .card h1 span { color: var(--beak); }
  .meta {
    margin: 0; font: 400 11px/1.4 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .04em; color: var(--ink-soft);
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-size: 13px; color: var(--ink);
    background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--ink-soft); }
  button:focus-visible { outline: 2px solid var(--beak); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ink); color: #16303F; border-color: var(--ink); }
  .hint { margin: 0; font-size: 12px; color: var(--ink-soft); }
  body.capture .card { display: none; }
</style>

<div id="stage"></div>
<div class="card">
  <h1>鵜鶘騎單車<span>.</span></h1>
  <p class="meta">OPUS 5.5 · THREE.JS · 黃金鵜鶘</p>
  <div class="row">
    <button id="play" type="button" aria-pressed="false">暫停</button>
    <button id="cam" type="button" aria-pressed="true">自動運鏡</button>
    <button id="speed" type="button">速度 1×</button>
    <button id="music" type="button" aria-pressed="false">♪ 播放音樂</button>
    <button id="scene" type="button">場景：小島</button>
  </div>
  <p class="hint">拖曳可以自己轉視角，滾輪縮放。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const CAPTURE = !!window.__CAPTURE;
  if (CAPTURE) document.body.classList.add('capture');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: CAPTURE });
  renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  // sky gradient
  (function () {
    const c = document.createElement('canvas'); c.width = 2; c.height = 256;
    const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#3F7FAE'); gr.addColorStop(0.3, '#86BCD6'); gr.addColorStop(0.46, '#EFD6A8'); gr.addColorStop(0.5, '#F4C68C'); gr.addColorStop(1, '#F4C68C');
    g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
    const tex = new THREE.CanvasTexture(c);
    const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false }));
    scene.add(sky); scene.userData.sky = sky;
  })();
  scene.fog = new THREE.Fog(0xE3D3B2, 45, 170);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1000);
  camera.position.set(6, 4, 10);

  const hemi = new THREE.HemisphereLight(0xDCEBF5, 0x5A6B4A, 0.75); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xFFD6A0, 1.1);
  sun.position.set(-22, 15, 13);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 70 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  const M = (color, opts) => new THREE.MeshStandardMaterial(Object.assign({ color, flatShading: true, roughness: 0.85, metalness: 0 }, opts || {}));
  const mat = {
    feather: M(0xF4F1EA), featherShade: M(0xDAD8D2), tip: M(0x2E3338),
    beak: M(0xF0B24A), pouch: M(0xE58C3A), leg: M(0xD9823B), eye: M(0x15191C, { roughness: 0.3 }),
    frame: M(0xC8453A, { roughness: 0.5, metalness: 0.2 }), tire: M(0x22262A), rim: M(0xBFC5C9, { metalness: 0.6, roughness: 0.35 }),
    seat: M(0x2A2420), metal: M(0x9AA2A8, { metalness: 0.6, roughness: 0.4 }),
    sand: M(0xE9D2A2), grass: M(0x7FA65A), wood: M(0xA7794E), woodDark: M(0x8A6240),
    white: M(0xF4F1EA), red: M(0xC8453A), lamp: new THREE.MeshBasicMaterial({ color: 0xFFE9A8 }),
    cloud: new THREE.MeshStandardMaterial({ color: 0xFFFFFF, flatShading: true, roughness: 1 })
  };

  const UP = new THREE.Vector3(0, 1, 0), XAX = new THREE.Vector3(1, 0, 0);
  function cyl(r, m, seg) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, seg || 8), m);
    mesh.castShadow = true; return mesh;
  }
  function placeBetween(mesh, a, b) {
    const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
    mesh.position.copy(a).addScaledVector(d, 0.5);
    mesh.scale.set(1, Math.max(len, 1e-4), 1);
    mesh.quaternion.setFromUnitVectors(UP, d.normalize());
  }
  function rod(parent, a, b, r, m) { const c = cyl(r, m); placeBetween(c, a, b); parent.add(c); return c; }
  const V = (x, y, z) => new THREE.Vector3(x, y, z || 0);
  function blob(parent, m, pos, scale, rot) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), m);
    s.position.copy(pos); s.scale.set(scale[0], scale[1], scale[2]);
    if (rot) s.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
    s.castShadow = true; parent.add(s); return s;
  }
  function blobAlong(parent, m, a, b, thick, width) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), m);
    const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
    s.position.copy(a).addScaledVector(d, 0.5);
    s.scale.set(len / 2, thick, width);
    s.quaternion.setFromUnitVectors(XAX, d.normalize());
    s.castShadow = true; parent.add(s); return s;
  }

  // scenes are built the first time they are visited (keeps phones light)
  const LAZY = [];
  function buildScene(name) { for (let i = LAZY.length - 1; i >= 0; i--) if (LAZY[i][0] === name) { const f = LAZY[i][1]; LAZY.splice(i, 1); f(); } }

  // ---------- island ----------
  const island = new THREE.Group(); scene.add(island);
  const R_PATH = 6;
  const sandMesh = new THREE.Mesh(new THREE.CylinderGeometry(8.6, 9.6, 1.2, 40), mat.sand);
  sandMesh.position.y = -0.6; sandMesh.receiveShadow = true; island.add(sandMesh);
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(5.05, 5.2, 0.12, 40), mat.grass);
  grass.position.y = 0.06; grass.receiveShadow = true; island.add(grass);
  const deck = new THREE.Mesh(new THREE.RingGeometry(5.2, 6.8, 96, 1), mat.wood);
  deck.rotation.x = -Math.PI / 2; deck.position.y = 0.03; deck.receiveShadow = true; island.add(deck);
  for (let i = 0; i < 120; i++) { // plank seams
    const a = i / 120 * Math.PI * 2;
    const seam = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.012, 0.025), mat.woodDark);
    seam.position.set(Math.cos(a) * 6, 0.04, Math.sin(a) * 6); seam.rotation.y = -a;
    seam.receiveShadow = true; island.add(seam);
  }
  for (let i = 0; i < 16; i++) { // bollards
    const a = i / 16 * Math.PI * 2 + 0.1;
    const p = cyl(0.09, mat.woodDark, 7); p.scale.y = 0.55;
    p.position.set(Math.cos(a) * 7.1, 0.27, Math.sin(a) * 7.1); island.add(p);
  }
  // lighthouse
  const lh = new THREE.Group(); island.add(lh);
  for (let i = 0; i < 5; i++) {
    const r0 = 1.0 - i * 0.12, r1 = 1.0 - (i + 1) * 0.12;
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, 1.0, 16), i % 2 ? mat.red : mat.white);
    seg.position.y = 0.12 + i * 1.0 + 0.5; seg.castShadow = true; lh.add(seg);
  }
  const gallery = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.1, 16), mat.tip); gallery.position.y = 5.17; lh.add(gallery);
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.55, 12), mat.lamp); lamp.position.y = 5.5; lh.add(lamp);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.5, 12), mat.red); cap.position.y = 6.03; cap.castShadow = true; lh.add(cap);
  // little shrubs
  [[2.4, 1.2], [-2.8, 1.9], [1.1, -3.2], [-1.6, -2.6], [3.3, -1.4]].forEach(([x, z], i) => {
    blob(island, M(0x5E8C45), V(x, 0.3, z), [0.5 + i * 0.05, 0.38, 0.5], [0, i, 0]);
  });

  // ---------- sea ----------
  const seaGeo = new THREE.PlaneGeometry(260, 260, 110, 110); seaGeo.rotateX(-Math.PI / 2);
  const seaBase = seaGeo.attributes.position.array.slice();
  const sea = new THREE.Mesh(seaGeo, new THREE.MeshStandardMaterial({ color: 0x2F7C95, flatShading: true, roughness: 0.55, metalness: 0.1 }));
  sea.position.y = -0.4; sea.receiveShadow = true; scene.add(sea);
  function updateSea(t) {
    const p = seaGeo.attributes.position.array;
    for (let i = 0; i < p.length; i += 3) {
      const x = seaBase[i], z = seaBase[i + 2];
      p[i + 1] = Math.sin(x * 0.35 + t * 1.1) * 0.12 + Math.cos(z * 0.28 - t * 0.9) * 0.12 + Math.sin((x + z) * 0.6 + t * 1.7) * 0.05;
    }
    seaGeo.attributes.position.needsUpdate = true;
    seaGeo.computeVertexNormals();
  }

  // ---------- clouds ----------
  const clouds = [];
  for (let i = 0; i < 9; i++) {
    const c = new THREE.Group();
    const n = 4 + (i % 3);
    for (let k = 0; k < n; k++) {
      const r = 2.2 + ((i * 7 + k * 3) % 5) * 0.5;
      blob(c, mat.cloud, V(k * 2.4 - n * 1.2, (k % 2) * 0.8, ((k * 5) % 3) - 1), [r, r * 0.7, r]);
    }
    c.children.forEach(ch => ch.castShadow = false);
    const a = i / 9 * Math.PI * 2;
    c.userData = { a, r: 70 + (i % 4) * 14, y: 22 + (i % 3) * 6 };
    scene.add(c); clouds.push(c);
  }

  // ---------- bike + pelican ----------
  const rider = new THREE.Group(); scene.add(rider);          // follows path, yaw
  const lean = new THREE.Group(); rider.add(lean);             // lean into turn
  const WR = 0.5;
  const REAR = V(-0.8, WR), FRONT = V(0.8, WR), BB = V(-0.05, 0.44), CRANK = 0.2;
  const SEAT = V(-0.36, 1.16), HEAD_T = V(0.62, 1.2), HEAD_B = V(0.6, 0.94);

  function makeWheel(pos) {
    const w = new THREE.Group(); w.position.copy(pos);
    const tire = new THREE.Mesh(new THREE.TorusGeometry(WR - 0.03, 0.035, 8, 40), mat.tire); tire.castShadow = true; w.add(tire);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(WR - 0.075, 0.012, 6, 40), mat.rim); w.add(rim);
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      rod(w, V(0, 0, (i % 2 ? 0.03 : -0.03)), V(Math.cos(a) * (WR - 0.08), Math.sin(a) * (WR - 0.08)), 0.006, mat.rim);
    }
    const hub = cyl(0.04, mat.metal); hub.rotation.x = Math.PI / 2; hub.scale.y = 0.12; w.add(hub);
    lean.add(w); return w;
  }
  const rearWheel = makeWheel(REAR), frontWheel = makeWheel(FRONT);

  // frame
  const TT_BACK = V(-0.32, 1.06);
  [[REAR, BB], [BB, TT_BACK], [TT_BACK, HEAD_T.clone().add(V(-0.01, -0.06))], [BB, HEAD_B], [HEAD_B, HEAD_T]].forEach(([a, b]) => rod(lean, a, b, 0.032, mat.frame));
  [-0.06, 0.06].forEach(z => {
    rod(lean, V(REAR.x, REAR.y, z), V(TT_BACK.x, TT_BACK.y, 0), 0.02, mat.frame);
    rod(lean, V(REAR.x, REAR.y, z), V(BB.x, BB.y, 0), 0.022, mat.frame);
    rod(lean, V(HEAD_B.x, HEAD_B.y, 0), V(FRONT.x, FRONT.y, z), 0.022, mat.frame);
  });
  rod(lean, TT_BACK, SEAT, 0.02, mat.metal);
  blob(lean, mat.seat, SEAT.clone().add(V(0.02, 0.03)), [0.17, 0.035, 0.08]);
  // stem + handlebar
  const BAR = V(0.56, 1.32);
  rod(lean, HEAD_T, BAR, 0.022, mat.metal);
  rod(lean, V(BAR.x, BAR.y, -0.3), V(BAR.x, BAR.y, 0.3), 0.018, mat.metal);
  [-0.27, 0.27].forEach(z => { const g = cyl(0.028, mat.tire); g.rotation.x = Math.PI / 2; g.scale.y = 0.1; g.position.set(BAR.x, BAR.y, z); lean.add(g); });
  // drivetrain
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.015, 20), mat.metal); ring.rotation.x = Math.PI / 2; ring.position.set(BB.x, BB.y, 0.08); lean.add(ring);
  const cog = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.015, 14), mat.metal); cog.rotation.x = Math.PI / 2; cog.position.set(REAR.x, REAR.y, 0.08); lean.add(cog);
  rod(lean, V(BB.x, BB.y + 0.12, 0.08), V(REAR.x, REAR.y + 0.05, 0.08), 0.006, mat.tire);
  rod(lean, V(BB.x, BB.y - 0.12, 0.08), V(REAR.x, REAR.y - 0.05, 0.08), 0.006, mat.tire);
  // cranks & pedals (dynamic)
  const crankArms = [cyl(0.018, mat.metal), cyl(0.018, mat.metal)]; crankArms.forEach(c => lean.add(c));
  const pedals = [0, 1].map(() => { const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.09), mat.tire); p.castShadow = true; lean.add(p); return p; });

  // pelican body — faceted, feathered (not smooth ellipsoids)
  const bird = new THREE.Group(); bird.userData.isBird = true; lean.add(bird);
  const pm = {
    body: M(0xEFEBE2), cov: M(0xE0DBD0), cov2: M(0xCFC9BC), grey: M(0xA9A59C),
    prim: M(0x2B2F33), chest: M(0xF1DFB0), crest: M(0xF3DC98)
  };
  [pm.body, pm.cov, pm.cov2, pm.grey, pm.prim, pm.chest, pm.crest].forEach(m => { m.side = THREE.DoubleSide; });
  function facet(parent, m, pos, scale, rot, detail) {
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(1, detail == null ? 1 : detail), m);
    s.position.copy(pos); s.scale.set(scale[0], scale[1], scale[2]);
    if (rot) s.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
    s.castShadow = true; parent.add(s); return s;
  }
  // body: icosphere tapered toward the tail, keel-flattened underneath, chest pushed forward
  (function () {
    const g = new THREE.IcosahedronGeometry(1, 2); const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const taper = x < 0 ? 1 + x * 0.5 : 1 + x * 0.08;
      y *= taper; z *= taper;
      if (y < 0) y *= 0.82;
      if (x > 0.2) y += (x - 0.2) * 0.25;
      x *= x < 0 ? 1.15 : 1;
      p.setXYZ(i, x, y, z);
    }
    g.computeVertexNormals();
    const body = new THREE.Mesh(g, pm.body);
    body.position.set(-0.26, 1.55, 0); body.scale.set(0.5, 0.32, 0.29); body.rotation.z = 0.22;
    body.castShadow = true; bird.add(body);
  })();
  facet(bird, pm.chest, V(0.1, 1.62), [0.13, 0.16, 0.2], [0, 0, 0.3], 1);

  // one feather shape, reused everywhere: flat, pointed, slightly thick
  const featherGeo = (function () {
    const s = new THREE.Shape();
    s.moveTo(0, -0.16); s.lineTo(0.62, -0.5); s.lineTo(1, 0); s.lineTo(0.62, 0.5); s.lineTo(0, 0.16); s.lineTo(0, -0.16);
    const g = new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false });
    g.translate(0, 0, -0.5); return g;
  })();
  const _x = new THREE.Vector3(), _y = new THREE.Vector3(), _z = new THREE.Vector3(), _m = new THREE.Matrix4();
  function feather(parent, m, base, dir, normal, len, w) {
    const f = new THREE.Mesh(featherGeo, m);
    _x.copy(dir).normalize();
    _z.copy(normal).addScaledVector(_x, -normal.dot(_x)).normalize();
    _y.crossVectors(_z, _x);
    _m.makeBasis(_x, _y, _z); f.quaternion.setFromRotationMatrix(_m);
    f.position.copy(base); f.scale.set(len, w, 0.012);
    f.castShadow = true; parent.add(f); return f;
  }
  // flank coverts: overlapping rows pointing back, darkening toward the wingtip
  [-1, 1].forEach(s => {
    const n = V(0, 0.15, s);
    const rows = [
      { y: 1.66, z: 0.25, xs: [0.02, -0.14, -0.3], len: 0.26, w: 0.13, m: pm.cov },
      { y: 1.56, z: 0.28, xs: [-0.04, -0.2, -0.36, -0.5], len: 0.3, w: 0.13, m: pm.cov2 },
      { y: 1.46, z: 0.26, xs: [-0.16, -0.32, -0.48], len: 0.36, w: 0.1, m: pm.grey },
      { y: 1.44, z: 0.22, xs: [-0.58, -0.66], len: 0.34, w: 0.08, m: pm.prim }
    ];
    rows.forEach(r => r.xs.forEach((x, k) => {
      feather(bird, r.m, V(x, r.y + k * 0.012, s * (r.z - k * 0.012)), V(-1, -0.18, -s * 0.08), n, r.len, r.w);
    }));
  });
  // tail fan
  [-0.14, -0.07, 0, 0.07, 0.14].forEach((dz, i) => {
    feather(bird, i % 2 ? pm.grey : pm.cov2, V(-0.66, 1.46, dz * 0.5), V(-1, 0.12, dz * 1.6), V(0, 1, 0), 0.3, 0.09);
  });

  // neck + head (bobbing group)
  const headGrp = new THREE.Group(); bird.add(headGrp);
  const neckCurve = new THREE.CatmullRomCurve3([V(-0.0, 1.68), V(0.1, 1.9), V(0.03, 2.12), V(0.12, 2.3)]);
  const neck = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 16, 0.062, 6, false), pm.body); neck.castShadow = true; headGrp.add(neck);
  facet(headGrp, pm.body, V(0.05, 1.78), [0.1, 0.11, 0.1], null, 0); // neck base blend
  facet(headGrp, pm.body, V(0.16, 2.36), [0.14, 0.105, 0.1], [0, 0, -0.15], 1);
  // shaggy crest at the back of the head
  [[0.05, 2.43, 0.9], [0.04, 2.4, 0.55], [0.06, 2.46, 1.25]].forEach(([x, y, a]) => {
    feather(headGrp, pm.crest, V(x, y), V(-Math.cos(a - 0.6), Math.sin(a - 0.6) * 0.8, 0), V(0, 0, 1), 0.16, 0.07);
  });
  [-1, 1].forEach(s => {
    facet(headGrp, M(0xF2CDA0), V(0.22, 2.38, s * 0.085), [0.045, 0.035, 0.012], null, 0); // bare skin round the eye
    facet(headGrp, mat.eye, V(0.225, 2.385, s * 0.095), [0.02, 0.02, 0.01], null, 0);
  });
  const beakGrp = new THREE.Group(); beakGrp.position.set(0.25, 2.35, 0); beakGrp.rotation.z = -0.5; headGrp.add(beakGrp);
  const upper = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.8, 4), mat.beak);

      audio.play().then(() => { btnMusic.textContent = '♪ 停止音樂'; btnMusic.setAttribute('aria-pressed', 'true'); })
        .catch(() => { btnMusic.textContent = '♪ 音樂無法播放'; });
    } else { audio.pause(); btnMusic.textContent = '♪ 播放音樂'; btnMusic.setAttribute('aria-pressed', 'false'); }
  };
  controls.addEventListener('start', () => { if (auto) { auto = false; controls.target.copy(focus); syncUI(); } });
  syncUI();

  const prevFocus = new THREE.Vector3();
  pose(0); autoCam(0); prevFocus.copy(focus);
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) t += dt * speed;
    pose(t);
    if (auto) { autoCam(t); prevFocus.copy(focus); }
    else {
      focus.set(0.1, 1.3, 0); rider.localToWorld(focus);
      const delta = tmp.subVectors(focus, prevFocus);
      camera.position.add(delta); controls.target.add(delta); prevFocus.copy(focus);
      controls.update();
    }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
